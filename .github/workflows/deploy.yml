# 推送到 main 時自動建置並上線到 GitHub Pages
# 網址：https://<帳號>.github.io/life-app/（綜合首頁）、/water/（喝水）、/health/（健康）、/bowel/（排便）、/money/（記帳）、/calendar/（行事曆）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每月重新抓官方辦公日曆；只更新部署成品，不自動 commit。
  schedule:
    - cron: '0 18 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Update Taiwan office calendar
        continue-on-error: true
        run: node scripts/update-taiwan-calendar.mjs
      # 用戶端 ID 不是密碼（本來就會出現在網頁裡），存在 GitHub 的 Variables
      - name: Build hub
        run: pnpm --filter hub build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build water
        run: pnpm --filter water build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/water/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build health
        run: pnpm --filter health build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/health/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build bowel
        run: pnpm --filter bowel build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/bowel/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build money
        run: pnpm --filter money build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/money/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build calendar
        run: pnpm --filter calendar build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/calendar/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build period
        run: pnpm --filter period build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/period/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Assemble site
        run: |
          mkdir -p _site/water _site/health _site/bowel _site/money _site/calendar _site/period
          cp -r apps/hub/dist/. _site/
          cp -r apps/water/dist/. _site/water/
          cp -r apps/health/dist/. _site/health/
          cp -r apps/bowel/dist/. _site/bowel/
          cp -r apps/money/dist/. _site/money/
          cp -r apps/calendar/dist/. _site/calendar/
          cp -r apps/period/dist/. _site/period/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
