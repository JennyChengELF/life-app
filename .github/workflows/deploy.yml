# 推送到 main 時自動建置並上線到 GitHub Pages
# 網址：https://<帳號>.github.io/life-app/（綜合首頁）、/water/（喝水）、/health/（健康）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 用戶端 ID 不是密碼（本來就會出現在網頁裡），存在 GitHub 的 Variables
      - name: Build hub
        run: pnpm --filter hub build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Build water
        run: pnpm --filter water build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/water/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build health
        run: pnpm --filter health build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/health/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Assemble site
        run: |
          mkdir -p _site/water _site/health
          cp -r apps/hub/dist/. _site/
          cp -r apps/water/dist/. _site/water/
          cp -r apps/health/dist/. _site/health/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
